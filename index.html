<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video en Pantalla Completa</title>
    <style>
        /* Elimina los márgenes de la página */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Fondo negro mientras carga */
        }

        /* Fuerza al video a ocupar toda la pantalla */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta el video sin deformarlo, recortando los bordes si es necesario */
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Atributos: 
         loop (reproducción en bucle)
         autoplay (reproducción automática)
         muted (obligatorio en navegadores modernos para que el autoplay funcione)
         controls (opcional, quítalo si no quieres que se vean los botones de pausa/volumen) -->
    <video autoplay muted loop controls>
        <source src="videos/video.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de video.
    </video>

</body>
</html>
