<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Pantalla Completa</title>
    <style>
        /* Elimina los márgenes de la página */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Oculta barras de scroll */
            background-color: #000; /* Fondo negro por si el video tarda en cargar */
        }
        /* Hace que el video ocupe toda la pantalla */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta el video para llenar la pantalla sin deformarse */
        }
    </style>
</head>
<body>

    <!-- 
      Atributos:
      - loop: Se reproduce en bucle infinito.
      - autoplay: Se reproduce solo al cargar.
      - muted: Obligatorio para que el navegador permita el autoplay.
      - playsinline: Evita que en móviles se abra el reproductor nativo del sistema.
    -->
    <video autoplay loop muted playsinline>
        <source src="video.mp4" type="video/mp4">
        Tu navegador no soporta video.
    </video>

</body>
</html>
